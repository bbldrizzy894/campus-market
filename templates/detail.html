{% extends "base.html" %}
{% block content %}
    <p><a href="/">首页</a><a href="/items">商品列表</a><a href="/publish">发布商品</a><a href="logout">退出</a>
    <p><a href="/items">← 返回列表</a></p>
    {% if msg %}
    <p style="color: aquamarine;">{{msg}}</p>
    {% endif %}
    <h2>{{item["title"]}}</h2>
    <p>价格：{{ item['price'] }}</p>
    <p>描述：{{ item['description'] }}</p>
    <p>卖家：{{ item['seller'] }}</p>
    {% if item['image'] %}
    <img src="/static/uploads/{{item['image']}}" width="300">
    {% endif %}
{% endblock %}
