{% extends "base.html" %}
{% block content %}
    {% if msg %}
    <p style="color: red;">{{ msg }}</p>
    {% endif %}
    <h1>校园二手书市</h1>
    <h2>旧书不旧 故事继续</h2>
    <form action="/items" method="get">
           <input type="text" name="q">
           <button type="submit">搜索</button>
    </form>
    {% for item in items %}
    <p><a href="/item/{{item["id"]}}">{{item["title"]}}</a>--{{item["price"]}}元</p>
    {% endfor %}
{% endblock %}
