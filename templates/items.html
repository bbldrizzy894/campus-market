{% extends "base.html" %}
{% block content %}
    <!-- 搜索框 -->
    <form action="/items" method="get">
        <input type="text" name="q" placeholder="搜索书名" value="{{q or ''}}">
        <button type="submit">搜索</button>
    </form>
    {% for item in items %}
    <p>
        <a href="/item/{{item['id']}}">{{item['title']}}</a>
        价格:{{item["price"]}}
        卖家:{{item["seller"]}}
        {% if session.get("account")==item["seller"] %}
            <a href="/delete/{{item['id']}}">删除</a>
        {% endif %}
    </p>
    {% endfor %}

    {% if not items %}
    <p>未找到相关商品</p>
    {% endif %}
{% endblock %}
