{% extends "base.html" %}
{% block content %}
    <!-- 搜索框 -->
    <form action="/items" method="get">
        <input type="text" name="q" placeholder="搜索书名" value="{{q or ''}}">
        <button type="submit">搜索</button>
    </form>
    <table class="table table-striped table-hover">
    <thead>
        <tr><th>标题</th><th>价格</th><th>卖家</th></tr>
    </thead>
    {% for item in items %}
    <tr>
        <td><a class="btn btn-primary btn-sm" href="/item/{{item['id']}}">{{item['title']}}</a></td>
        <td>{{item["price"]}}</td>
        <td>{{item["seller"]}}</td>
        <td>{% if session.get("account")==item["seller"] %}
            <a href="/delete/{{item['id']}}">删除</a>
        {% endif %}</td>
    </tr>
    {% endfor %}
    </table>
    {% if not items %}
    <p>未找到相关商品</p>
    {% endif %}
{% endblock %}
