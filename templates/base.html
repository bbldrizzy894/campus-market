<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}校园二手书市{% endblock %}</title>
</head>
<body>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <nav class="navbar navbar-expand navbar-light bg-light mb-3">
        <div class="container">
        <a class="navbar-brand" href="/">校园二手书市</a>
        <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/items">商品列表</a></li>
        {% if session.get("account") %}
        <li class="nav-item"><a class="nav-link" href="/publish">发布商品</a></li>
        {% else %}
        <li class="nav-item"><a class="nav-link" href="/login?msg=请先完成登录">发布商品</a></li>
        {% endif %}
        </ul>
        <ul class="navbar-nav ms-auto">
        {% if session.get("account") %}
            <li class="nav-item"><span class="navbar-text ms-auto">你好{{session.get("account")}}!</span> </li>
            <li class="nav-item"><a class="nav-link" href="/my_orders">我的订单</a> </li>
            <li class="nav-item"><a class="nav-link" href="/logout">退出</a></li>
        {% else %}
            <a class="nav-link ms-auto" href="/login">登录</a>
            <a class="nav-link" href="/register">注册</a>
        {% endif %}
        </ul>
        </div>
    </nav>
    {% block content %}
    {% endblock %}
        </div>

</body>
</html>
